name: DataFlow Lite quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static JS and logic
        run: |
          node --check logic.js
          node --check demo.js
          node test_logic.js
          node test_demo.js
          node --check general.js
          node test_general_logic.js
      - name: Install Chromium browser tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: E2E real Chromium
        run: python -m unittest discover -s tests -p 'test_*.py' -v
